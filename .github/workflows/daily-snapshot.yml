name: daily-snapshot

# Hyperliquid Daily Snapshot to Discord + X (image card with optional Gemini JP summary).
# JST 00:00 / 08:00 / 16:00 — :05 minute to dodge GH Actions top-of-hour rush.
on:
  schedule:
    - cron: '5 15 * * *'  # 00:05 JST  (15:05 UTC, prev day)
    - cron: '5 23 * * *'  # 08:05 JST  (23:05 UTC, prev day)
    - cron: '5 7 * * *'   # 16:05 JST  (07:05 UTC, same day)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip actual Discord/X posts (preview only)'
        type: boolean
        default: false

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Japanese font (for image rendering)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install
        run: pip install -e .

      - name: Run Hyperliquid daily snapshot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: INFO
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m src.daily_snapshot.job
